# Basic application configuration
spring.application.name=finzly.rtp.validator
spring.profiles.active=local

# Disable Liquibase for local development
spring.liquibase.enabled=false

# Disable Spring Cloud Config for local development
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Disable AWS services
spring.cloud.aws.enabled=false
spring.cloud.aws.parameter-store.enabled=false
spring.cloud.aws.sqs.enabled=false
spring.cloud.aws.s3.enabled=false
spring.cloud.aws.credentials.enabled=false
spring.cloud.aws.region.enabled=false
spring.autoconfigure.exclude=io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration,io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration,io.awspring.cloud.autoconfigure.config.parameterstore.ParameterStoreAutoConfiguration,io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration

# Server configuration
server.port=8080
server.servlet.context-path=/rtp-message

# Database configuration for local development
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Jackson configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Management endpoints
management.contextPath=/actuator
management.endpoints.web.exposure.include=*
management.security.enabled=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.finzly.galaxy.rtp=DEBUG

# Allow circular references for development
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
