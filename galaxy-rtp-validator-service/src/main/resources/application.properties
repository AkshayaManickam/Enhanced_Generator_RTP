server.port=8080

spring.application.name=galaxy-rtp-validator-service

# Disable Spring Cloud Config
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Disable AWS Auto Configuration
spring.cloud.aws.s3.enabled=false
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=dummy
spring.cloud.aws.credentials.secret-key=dummy

# Disable Liquibase
spring.liquibase.enabled=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Exclude unnecessary auto-configurations
spring.autoconfigure.exclude=\
  io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration,\
  io.awspring.cloud.autoconfigure.core.AwsCoreAutoConfiguration,\
  io.awspring.cloud.autoconfigure.context.ContextResourceLoaderAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.javers.spring.boot.sql.JaversSqlAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# Disable Spring Security
spring.security.enabled=false
management.security.enabled=false

# Logging
logging.level.com.finzly.galaxy.rtp.validator=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=OFF

