mandatory:
    - path: "GrpHdr.MsgId"
      description: "Message Identification - Unique identifier for the message"
      dataType: "Max35Text"
      sampleValue: "MSG{timestamp}-{index}"
    - path: "GrpHdr.CreDtTm"
      description: "Creation Date Time - Date and time when the message was created"
      dataType: "ISODateTime"
      sampleValue: "{currentDateTime}"
    - path: "GrpHdr.NbOfTxs"
      description: "Number Of Transactions - Total number of transactions in the message"
      dataType: "Max15NumericText"
      sampleValue: "1"
    - path: "GrpHdr.TtlIntrBkSttlmAmt"
      description: "Total Interbank Settlement Amount - Total amount for all transactions"
      dataType: "ActiveCurrencyAndAmount"
      sampleValue: "1000.00"
    - path: "GrpHdr.TtlIntrBkSttlmAmt.Ccy"
      description: "Currency - Currency code for the settlement amount"
      dataType: "ActiveCurrencyCode"
      sampleValue: "USD"
    - path: "GrpHdr.IntrBkSttlmDt"
      description: "Interbank Settlement Date - Date for interbank settlement"
      dataType: "ISODate"
      sampleValue: "{currentDate}"
    - path: "GrpHdr.SttlmInf.SttlmMtd"
      description: "Settlement Method - Method used for settlement"
      dataType: "SettlementMethod2Code"
      sampleValue: "CLRG"
    - path: "GrpHdr.SttlmInf.ClrSys.Cd"
      description: "Clearing System Code - Code identifying the clearing system"
      dataType: "ExternalCashClearingSystem1Code"
      sampleValue: "TCH"
    - path: "CdtTrfTxInf.PmtId.InstrId"
      description: "Instruction Identification - Unique instruction identifier"
      dataType: "Max35Text"
      sampleValue: "INSTR{timestamp}-{index}"
    - path: "CdtTrfTxInf.PmtId.EndToEndId"
      description: "End To End Identification - Unique end-to-end identifier"
      dataType: "Max35Text"
      sampleValue: "E2E{timestamp}-{index}"
    - path: "CdtTrfTxInf.PmtId.TxId"
      description: "Transaction Identification - Unique transaction identifier"
      dataType: "Max35Text"
      sampleValue: "TX{timestamp}-{index}"
    - path: "CdtTrfTxInf.PmtTpInf.SvcLvl.Cd"
      description: "Service Level Code - Code indicating the service level"
      dataType: "ExternalServiceLevel1Code"
      sampleValue: "SDVA"
    - path: "CdtTrfTxInf.PmtTpInf.LclInstrm.Prtry"
      description: "Local Instrument Proprietary - Proprietary local instrument code"
      dataType: "Max35Text"
      sampleValue: "STANDARD"
    - path: "CdtTrfTxInf.PmtTpInf.CtgyPurp.Prtry"
      description: "Category Purpose Proprietary - Purpose category for the payment"
      dataType: "Max35Text"
      sampleValue: "BUSINESS"
    - path: "CdtTrfTxInf.IntrBkSttlmAmt"
      description: "Interbank Settlement Amount - Amount for interbank settlement"
      dataType: "ActiveCurrencyAndAmount"
      sampleValue: "1000.00"
    - path: "CdtTrfTxInf.IntrBkSttlmAmt.Ccy"
      description: "Currency - Currency code for the settlement amount"
      dataType: "ActiveCurrencyCode"
      sampleValue: "USD"
    - path: "CdtTrfTxInf.ChrgBr"
      description: "Charge Bearer - Who bears the charges for the transaction"
      dataType: "ChargeBearerType1Code"
      sampleValue: "SLEV"
    - path: "CdtTrfTxInf.InstgAgt.FinInstnId.BICFI"
      description: "Instructing Agent BICFI - BICFI of the instructing agent"
      dataType: "BICFIDec2014Identifier"
      sampleValue: "BOFAUS3N"
    - path: "CdtTrfTxInf.InstdAgt.FinInstnId.BICFI"
      description: "Instructed Agent BICFI - BICFI of the instructed agent"
      dataType: "BICFIDec2014Identifier"
      sampleValue: "CHASUS33"
    - path: "CdtTrfTxInf.Dbtr.Nm"
      description: "Debtor Name - Name of the debtor"
      dataType: "Max140Text"
      sampleValue: "John Doe"
    - path: "CdtTrfTxInf.DbtrAcct.Id.IBAN"
      description: "Debtor Account IBAN - IBAN of the debtor account"
      dataType: "IBAN2007Identifier"
      sampleValue: "US12345678901234567890"
    - path: "CdtTrfTxInf.Cdtr.Nm"
      description: "Creditor Name - Name of the creditor"
      dataType: "Max140Text"
      sampleValue: "Jane Smith"
    - path: "CdtTrfTxInf.CdtrAcct.Id.IBAN"
      description: "Creditor Account IBAN - IBAN of the creditor account"
      dataType: "IBAN2007Identifier"
      sampleValue: "US98765432109876543210"

optional:
  - path: "CdtTrfTxInf.UETR"
    description: "Unique End-to-end Transaction Reference - Globally unique transaction reference"
    dataType: "UUIDv4Identifier"
    sampleValue: "{uuid}"
    isoDescription: "ISO 20022 field for unique transaction reference"
  - path: "CdtTrfTxInf.ClrSysRef"
    description: "Clearing System Reference - Reference from the clearing system"
    dataType: "Max35Text"
    sampleValue: "CLR{timestamp}"
    isoDescription: "ISO 20022 field for clearing system reference"
  - path: "CdtTrfTxInf.RmtInf.Ustrd"
    description: "Unstructured Remittance Information - Free text remittance information"
    dataType: "Max140Text"
    sampleValue: "Payment for services rendered"
    isoDescription: "ISO 20022 field for unstructured remittance information"
  - path: "CdtTrfTxInf.RmtInf.Strd"
    description: "Structured Remittance Information - Structured remittance information"
    dataType: "StructuredRemittanceInformation16"
    sampleValue: "Structured remittance data"
    isoDescription: "ISO 20022 field for structured remittance information"
  - path: "CdtTrfTxInf.ChrgsInf"
    description: "Charges Information - Information about charges"
    dataType: "Charges7"
    sampleValue: "Charge information"
    isoDescription: "ISO 20022 field for charges information"
  - path: "CdtTrfTxInf.UltmtDbtr"
    description: "Ultimate Debtor - Ultimate party that owes the money"
    dataType: "PartyIdentification135"
    sampleValue: "Ultimate Debtor Name"
    isoDescription: "ISO 20022 field for ultimate debtor identification"
  - path: "CdtTrfTxInf.InitgPty.PstlAdr"
    description: "Initiating Party Postal Address - Postal address of the initiating party"
    dataType: "PostalAddress24"
    sampleValue: "123 Business St, City, State, 12345, US"
    isoDescription: "ISO 20022 field for initiating party postal address"
  - path: "CdtTrfTxInf.Dbtr.PstlAdr"
    description: "Debtor Postal Address - Postal address of the debtor"
    dataType: "PostalAddress24"
    sampleValue: "456 Debtor St, City, State, 12345, US"
    isoDescription: "ISO 20022 field for debtor postal address"
  - path: "CdtTrfTxInf.Cdtr.PstlAdr"
    description: "Creditor Postal Address - Postal address of the creditor"
    dataType: "PostalAddress24"
    sampleValue: "789 Creditor St, City, State, 12345, US"
    isoDescription: "ISO 20022 field for creditor postal address"
  - path: "CdtTrfTxInf.Purp"
    description: "Purpose - Purpose of the payment"
    dataType: "Purpose2Choice"
    sampleValue: "Payment purpose"
    isoDescription: "ISO 20022 field for payment purpose"
  - path: "CdtTrfTxInf.Tax"
    description: "Tax Information - Tax-related information"
    dataType: "TaxInformation8"
    sampleValue: "Tax information"
    isoDescription: "ISO 20022 field for tax information"
  - path: "CdtTrfTxInf.InstrForCdtrAgt"
    description: "Instruction for Creditor Agent - Instructions for the creditor agent"
    dataType: "InstructionForCreditorAgent1"
    sampleValue: "Instructions for creditor agent"
    isoDescription: "ISO 20022 field for creditor agent instructions"

conditional:
  - path: "CdtTrfTxInf.InstgAgt.FinInstnId.ClrSysMmbId.MmbId"
    description: "Instructing Agent Clearing System Member ID - Member ID in clearing system"
    dataType: "Max35Text"
    sampleValue: "123456789"
    condition: "Required when BICFI is not available"
    isoDescription: "ISO 20022 field for clearing system member identification"
  - path: "CdtTrfTxInf.InstdAgt.FinInstnId.ClrSysMmbId.MmbId"
    description: "Instructed Agent Clearing System Member ID - Member ID in clearing system"
    dataType: "Max35Text"
    sampleValue: "987654321"
    condition: "Required when BICFI is not available"
    isoDescription: "ISO 20022 field for clearing system member identification"
  - path: "CdtTrfTxInf.DbtrAcct.Id.Othr"
    description: "Debtor Account Other Identification - Alternative account identification"
    dataType: "GenericAccountIdentification1"
    sampleValue: "Alternative account ID"
    condition: "Required when IBAN is not available"
    isoDescription: "ISO 20022 field for alternative account identification"
  - path: "CdtTrfTxInf.CdtrAcct.Id.Othr"
    description: "Creditor Account Other Identification - Alternative account identification"
    dataType: "GenericAccountIdentification1"
    sampleValue: "Alternative account ID"
    condition: "Required when IBAN is not available"
    isoDescription: "ISO 20022 field for alternative account identification"

fieldGroups:
  - name: "Basic Information"
    description: "Core payment information"
    fields: ["GrpHdr.MsgId", "GrpHdr.CreDtTm", "GrpHdr.NbOfTxs"]
  - name: "Amounts and Currency"
    description: "Payment amounts and currency information"
    fields: ["GrpHdr.TtlIntrBkSttlmAmt", "GrpHdr.TtlIntrBkSttlmAmt.Ccy", "CdtTrfTxInf.IntrBkSttlmAmt", "CdtTrfTxInf.IntrBkSttlmAmt.Ccy"]
  - name: "Parties Information"
    description: "Debtor, creditor, and agent information"
    fields: ["CdtTrfTxInf.Dbtr.Nm", "CdtTrfTxInf.Cdtr.Nm", "CdtTrfTxInf.InstgAgt.FinInstnId.BICFI", "CdtTrfTxInf.InstdAgt.FinInstnId.BICFI"]
  - name: "Account Information"
    description: "Debtor and creditor account details"
    fields: ["CdtTrfTxInf.DbtrAcct.Id.IBAN", "CdtTrfTxInf.CdtrAcct.Id.IBAN"]
  - name: "Address Information"
    description: "Postal addresses for parties"
    fields: ["CdtTrfTxInf.InitgPty.PstlAdr", "CdtTrfTxInf.Dbtr.PstlAdr", "CdtTrfTxInf.Cdtr.PstlAdr"]
  - name: "Remittance Information"
    description: "Payment remittance details"
    fields: ["CdtTrfTxInf.RmtInf.Ustrd", "CdtTrfTxInf.RmtInf.Strd"]
  - name: "Additional Information"
    description: "Charges, taxes, and other additional information"
    fields: ["CdtTrfTxInf.ChrgsInf", "CdtTrfTxInf.Tax", "CdtTrfTxInf.Purp", "CdtTrfTxInf.InstrForCdtrAgt"]
