<header class="bg-white shadow-sm border-b border-gray-200">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center space-x-3">
        <div class="flex items-center justify-center w-10 h-10 bg-primary-600 rounded-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900">ISO Message</h1>
          <p class="text-xs text-gray-500">Generator & Validator</p>
        </div>
      </a>

      <!-- Navigation -->
      <nav class="hidden md:flex items-center space-x-1">
        <a
          routerLink="/"
          [class]="'flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + 
                   (isActive('/') 
                     ? 'bg-primary-50 text-primary-700 border border-primary-200' 
                     : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50')"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span>Dashboard</span>
        </a>
        <a
          routerLink="/generator"
          [class]="'flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + 
                   (isActive('/generator') 
                     ? 'bg-primary-50 text-primary-700 border border-primary-200' 
                     : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50')"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span>Generator</span>
        </a>
        <a
          routerLink="/advanced-generator"
          [class]="'flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + 
                   (isActive('/advanced-generator') 
                     ? 'bg-primary-50 text-primary-700 border border-primary-200' 
                     : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50')"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
          <span>Advanced Generator</span>
        </a>
        <a
          routerLink="/validator"
          [class]="'flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + 
                   (isActive('/validator') 
                     ? 'bg-primary-50 text-primary-700 border border-primary-200' 
                     : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50')"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>Validator</span>
        </a>
        <a
          routerLink="/documentation"
          [class]="'flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors ' + 
                   (isActive('/documentation') 
                     ? 'bg-primary-50 text-primary-700 border border-primary-200' 
                     : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50')"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          <span>Documentation</span>
        </a>
      </nav>

      <!-- Status Indicator -->
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-2">
          <div class="w-2 h-2 bg-success-500 rounded-full animate-pulse"></div>
          <span class="text-xs text-gray-500">API Connected</span>
        </div>
      </div>
    </div>
  </div>
</header>
