<div class="processor-view">
  <header class="app-header">
    <div class="header-content">
      <div>
        <h1>Process RTP Payments</h1>
        <p class="subtitle">Validate and process Real-Time Payment transactions</p>
      </div>
      <button class="back-to-home-btn" (click)="backToHome()" title="Back to Home">
        Home
      </button>
    </div>
  </header>

  <!-- Message Banner -->
  <div *ngIf="message" class="message-banner" [ngClass]="'message-' + messageCategory">
    <span class="message-icon">
      <ng-container [ngSwitch]="messageCategory">
        <span *ngSwitchCase="'success'">✓</span>
        <span *ngSwitchCase="'error'">✕</span>
        <span *ngSwitchCase="'info'">ℹ</span>
      </ng-container>
    </span>
    <span class="message-text">{{ message }}</span>
  </div>

  <div class="main-content">
    <div class="payment-card">
      <div class="card-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <h2>Payment Information</h2>
      </div>

      <div class="card-body">
        <!-- Message Type -->
        <div class="form-group">
          <label>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            Message Type
          </label>
          <select class="form-control" [(ngModel)]="messageType" name="messageType">
            <option value="PACS.008 Message">PACS.008 Message</option>
          </select>
        </div>

        <!-- PACS.008 Message -->
        <div class="form-group">
          <label>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            PACS.008 Message
          </label>
          <div class="textarea-actions">
            <button type="button" class="action-btn" (click)="pasteFromClipboard()">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Paste
            </button>
            <button type="button" class="action-btn" (click)="clearMessage()">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
              Clear
            </button>
          </div>
          <textarea
            class="form-control message-textarea"
            placeholder="Paste your PACS.008 message here..."
            [(ngModel)]="pacs008Message"
            name="pacs008Message"
            rows="8"
          ></textarea>
        </div>

        <!-- Environment & Tenant -->
        <div class="form-row">
          <div class="form-group">
            <label>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
              Environment
            </label>
            <select class="form-control" [(ngModel)]="environment" name="environment">
              <option value="Dev">Dev</option>
              <option value="QA">QA</option>
              <option value="QA2">QA2</option>
              <option value="UAT">UAT</option>
              <option value="Prod">Prod</option>
            </select>
          </div>

          <div class="form-group">
            <label>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              Tenant
            </label>
            <select class="form-control" [(ngModel)]="tenant" name="tenant">
              <option value="banka">banka</option>
              <option value="bankb">bankb</option>
              <option value="bankc">bankc</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <button type="button" class="btn btn-secondary" (click)="resetForm()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
          Reset Form
        </button>
        <button 
          type="button" 
          class="btn btn-primary" 
          (click)="processPayment()" 
          [disabled]="!validateForm() || isProcessing"
        >
          <svg *ngIf="!isProcessing" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span *ngIf="!isProcessing">Process Payment</span>
          <span *ngIf="isProcessing">Processing...</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Custom Confirmation Modal -->
<div class="modal-overlay" *ngIf="showConfirmModal" (click)="closeConfirmModal()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ confirmModalTitle }}</h3>
      <button class="modal-close" (click)="closeConfirmModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p>{{ confirmModalMessage }}</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeConfirmModal()">Cancel</button>
      <button class="btn btn-primary" (click)="confirmAction()">OK</button>
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div class="toast-container" *ngIf="showToast">
  <div class="toast" [ngClass]="'toast-' + toastType">
    <div class="toast-icon">
      <svg *ngIf="toastType === 'success'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <svg *ngIf="toastType === 'error'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <svg *ngIf="toastType === 'info'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <svg *ngIf="toastType === 'warning'" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <div class="toast-message">{{ toastMessage }}</div>
    <button class="toast-close" (click)="showToast = false">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>
